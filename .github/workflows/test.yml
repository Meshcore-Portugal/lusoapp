name: Test suite

on:
  push:
    branches-ignore:
      - main
      - dev

concurrency:
  group: test-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-test-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-test-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run Flutter analysis
        run: flutter analyze --no-fatal-infos || exit 1

      - name: Run Flutter tests
        run: flutter test || exit 1

  macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-test-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-test-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Get iOS dependencies
        run: (cd ios; pod install)

      - name: Run Flutter analysis
        run: flutter analyze --no-fatal-infos || exit 1

      - name: Run Flutter tests
        run: flutter test || exit 1
